plugins {
    id 'com.android.application'
}

android {
    namespace 'com.agung.headhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.agung.headhome'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '0.1'
    }

    // Two editions with the same application id, so the owner build installs over the public one and keeps its
    // preferences. The owner flavor adds src/owner/res (not in git) to override the built-in car drawing.
    flavorDimensions "edition"
    productFlavors {
        publicEdition {
            dimension "edition"
            isDefault = true
        }
        owner {
            dimension "edition"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB: sign with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
